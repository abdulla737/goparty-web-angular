<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="container site-header__bar">
    <a [routerLink]="home().path" class="site-header__brand" [attr.aria-label]="ui().homeLabel" (click)="close()"><gp-logo /></a>

    <nav id="site-nav" class="site-nav" [class.is-open]="open()" [attr.aria-label]="ui().mainNavLabel">
      <ul class="site-nav__list">
        @for (item of nav(); track item.href) {
          <li>
            <a class="site-nav__link" [routerLink]="item.route.path" [fragment]="item.route.fragment" (click)="close()">{{ item.label }}</a>
          </li>
        }
      </ul>
      <div class="site-nav__actions">
        <a class="lang-switch" [routerLink]="i18n.switchLink()"
           [attr.hreflang]="i18n.other()" [attr.lang]="i18n.other()"
           [attr.title]="ui().switchLangLabel" (click)="close()">
          <span class="lang-switch__globe" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
          </span>
          {{ ui().switchLang }}
        </a>
        <a class="btn btn--quiet" [routerLink]="contact().path" (click)="close()">{{ ui().contactUs }}</a>
        <a class="btn btn--primary btn--sm" [routerLink]="plan().path" [fragment]="plan().fragment" (click)="close()">{{ ui().planYourParty }}</a>
      </div>
    </nav>

    <button type="button" class="site-header__toggle" (click)="toggle()"
            [attr.aria-expanded]="open()" aria-controls="site-nav"
            [attr.aria-label]="open() ? ui().closeMenu : ui().openMenu">
      <gp-icon [name]="open() ? 'close' : 'menu'" />
    </button>
  </div>
</header>
