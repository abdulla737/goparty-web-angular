<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | GoParty</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5eefb; color: #1b1030;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
    main { max-width: 520px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 2rem; } p { margin: 0; color: #625877; line-height: 1.6; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
    a { padding: 12px 20px; border-radius: 999px; background: #6a2bf2; color: #fff; font-weight: 700; text-decoration: none; }
    a.alt { background: #fff; color: #6a2bf2; border: 1.5px solid #e6def5; }
    [lang="ar"] { direction: rtl; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you are looking for doesn’t exist or has moved.</p>
    <p lang="ar">الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
    <div class="links">
      <a href="/">GoParty home</a>
      <a class="alt" href="/ar/" lang="ar">الصفحة الرئيسية</a>
      <a class="alt" href="/contact-us/">Contact us</a>
    </div>
  </main>
</body>
</html>
